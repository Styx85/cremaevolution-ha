version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      # One PR for all patch/minor updates; majors come separately.
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: daily
    ignore:
      # Bumped by hand together with manifest.json and a release.
      - dependency-name: aioecam
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]
