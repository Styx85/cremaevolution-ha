[project]
name = "cremaevolution-ha"
version = "0.3.2b1"
description = "Local-first Home Assistant integration for De'Longhi Coffee Link machines"
requires-python = ">=3.13.2"
dependencies = [
    "homeassistant>=2026.10.0",
    "aioecam==0.1.0b9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["custom_components/cremalink_ha"]
